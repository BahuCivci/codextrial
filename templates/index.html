<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>4 Mizaç Testi</title>
</head>
<body>
    <h1>Hangi mizaçtasın?</h1>
    <form method="post">
        <p>1. İnsanlarla iletişimin nasıl?</p>
        <label><input type="radio" name="q1" value="sanguine" required> Sıcakkanlı ve dışa dönük</label><br>
        <label><input type="radio" name="q1" value="choleric"> Hedef odaklı ve iddialı</label><br>
        <label><input type="radio" name="q1" value="melancholic"> Duygusal ve düşünceli</label><br>
        <label><input type="radio" name="q1" value="phlegmatic"> Sakin ve uyumlu</label><br>

        <p>2. Sorunlarla karşılaştığında nasıl yaklaşırsın?</p>
        <label><input type="radio" name="q2" value="sanguine" required> Çevrendekilerden destek alırım</label><br>
        <label><input type="radio" name="q2" value="choleric"> Hızlı ve kararlı hareket ederim</label><br>
        <label><input type="radio" name="q2" value="melancholic"> Önce ayrıntılı düşünürüm</label><br>
        <label><input type="radio" name="q2" value="phlegmatic"> Sakin kalıp akışına bırakırım</label><br>

        <p>3. Genel ruh halin nasıldır?</p>
        <label><input type="radio" name="q3" value="sanguine" required> Neşeli ve enerjik</label><br>
        <label><input type="radio" name="q3" value="choleric"> Hareketli ve hırslı</label><br>
        <label><input type="radio" name="q3" value="melancholic"> İçine kapanık ve hassas</label><br>
        <label><input type="radio" name="q3" value="phlegmatic"> Rahat ve dengeli</label><br>

        <p>4. Enerji seviyeni nasıl tarif edersin?</p>
        <label><input type="radio" name="q4" value="sanguine" required> Genellikle yüksek</label><br>
        <label><input type="radio" name="q4" value="choleric"> Yoğun ama kısa süreli</label><br>
        <label><input type="radio" name="q4" value="melancholic"> Zaman zaman düşük</label><br>
        <label><input type="radio" name="q4" value="phlegmatic"> Dengeli ve sakin</label><br>

        <button type="submit">Sonucu Göster</button>
    </form>

    {% if result %}
        <h2>Sonuç:</h2>
        <p>{{ result }}</p>
    {% endif %}
</body>
</html>
